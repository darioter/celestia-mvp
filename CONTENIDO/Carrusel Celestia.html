<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0e1a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Montserrat', sans-serif;
    overflow: hidden;
  }

  /* ── Stars background ── */
  .stars-layer {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(ellipse at 20% 50%, #1a2a4a22 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, #1a3a2a18 0%, transparent 50%);
  }
  .star {
    position: absolute;
    border-radius: 50%;
    background: #e8c878;
    animation: twinkle var(--d, 3s) ease-in-out infinite var(--delay, 0s);
  }
  @keyframes twinkle {
    0%, 100% { opacity: var(--min-op, 0.1); transform: scale(1); }
    50% { opacity: var(--max-op, 0.7); transform: scale(1.5); }
  }

  /* ── Phone shell ── */
  .phone-shell {
    position: relative;
    width: 360px;
    height: 640px;
    border-radius: 36px;
    overflow: hidden;
    box-shadow:
      0 0 0 1.5px #e8c87840,
      0 0 60px #e8c87820,
      0 40px 80px #00000080;
    z-index: 10;
  }

  /* ── Slide container ── */
  .slide-viewport {
    width: 100%;
    height: 100%;
    position: relative;
    overflow: hidden;
  }

  /* ── Individual Slides ── */
  .slide {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 32px;
    transition: none;
  }
  .slide.entering { animation: slideEnter 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  .slide.exiting  { animation: slideExit  0.5s cubic-bezier(0.55, 0, 1, 0.45) forwards; }
  .slide.hidden   { opacity: 0; pointer-events: none; }

  @keyframes slideEnter {
    from { opacity: 0; transform: translateY(30px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes slideExit {
    from { opacity: 1; transform: translateY(0) scale(1); }
    to   { opacity: 0; transform: translateY(-20px) scale(1.02); }
  }

  /* Staggered text children */
  .slide.entering .anim-0 { animation: textUp 0.6s cubic-bezier(0.22,1,0.36,1) 0.1s both; }
  .slide.entering .anim-1 { animation: textUp 0.6s cubic-bezier(0.22,1,0.36,1) 0.22s both; }
  .slide.entering .anim-2 { animation: textUp 0.6s cubic-bezier(0.22,1,0.36,1) 0.34s both; }
  .slide.entering .anim-3 { animation: textUp 0.6s cubic-bezier(0.22,1,0.36,1) 0.46s both; }
  .slide.entering .anim-4 { animation: textUp 0.6s cubic-bezier(0.22,1,0.36,1) 0.58s both; }
  .slide.entering .anim-5 { animation: textUp 0.6s cubic-bezier(0.22,1,0.36,1) 0.70s both; }
  @keyframes textUp {
    from { opacity: 0; transform: translateY(22px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Navigation ── */
  .nav-row {
    position: absolute;
    bottom: 20px;
    left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    z-index: 20;
  }
  .nav-dot {
    width: 6px; height: 6px;
    border-radius: 3px;
    background: #e8c87840;
    border: none;
    cursor: pointer;
    transition: all 0.3s ease;
    padding: 0;
  }
  .nav-dot.active {
    width: 20px;
    background: #e8c878;
    box-shadow: 0 0 8px #e8c87880;
  }
  .nav-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: #e8c87815;
    border: 1px solid #e8c87830;
    color: #e8c878;
    width: 36px; height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    z-index: 20;
    backdrop-filter: blur(4px);
  }
  .nav-arrow:hover { background: #e8c87830; box-shadow: 0 0 12px #e8c87840; }
  .nav-arrow.prev { left: 12px; }
  .nav-arrow.next { right: 12px; }

  /* ── Progress bar ── */
  .progress-bar {
    position: absolute;
    top: 0; left: 0;
    height: 2.5px;
    background: linear-gradient(90deg, #e8c878, #f5e19e);
    box-shadow: 0 0 8px #e8c87880;
    transition: width 0.4s ease;
    z-index: 30;
  }

  /* ── Language toggle ── */
  .lang-toggle {
    position: absolute;
    top: 18px;
    right: 18px;
    display: flex;
    gap: 2px;
    z-index: 25;
  }
  .lang-btn {
    background: transparent;
    border: 1px solid #e8c87840;
    color: #e8c87880;
    font-family: 'Montserrat', sans-serif;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.08em;
    padding: 3px 7px;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .lang-btn.active {
    background: #e8c87820;
    color: #e8c878;
    border-color: #e8c87870;
  }

  /* ── Divider ── */
  .gold-line {
    width: 48px; height: 1px;
    background: linear-gradient(90deg, transparent, #e8c878, transparent);
    margin: 16px auto;
  }
  .gold-line-wide {
    width: 80px; height: 1px;
    background: linear-gradient(90deg, transparent, #e8c878, transparent);
    margin: 12px auto;
  }

  /* ── Decorative circle ── */
  .deco-ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid #e8c87820;
    animation: ringPulse 4s ease-in-out infinite;
  }
  @keyframes ringPulse {
    0%, 100% { transform: scale(1); opacity: 0.4; }
    50% { transform: scale(1.05); opacity: 0.8; }
  }

  /* ── Step cards ── */
  .step-card {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    width: 100%;
    padding: 14px 16px;
    border-radius: 10px;
    margin-bottom: 10px;
  }
  .step-num {
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 300;
    color: #e8c878;
    line-height: 1;
    min-width: 28px;
  }
  .step-text { display: flex; flex-direction: column; gap: 3px; }

  /* ── Tweaks panel ── */
  .tweaks-panel {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #0f1628ee;
    border: 1px solid #e8c87830;
    border-radius: 14px;
    padding: 18px;
    width: 210px;
    z-index: 1000;
    backdrop-filter: blur(16px);
    display: none;
    box-shadow: 0 8px 40px #00000060;
  }
  .tweaks-panel.open { display: block; }
  .tweaks-title {
    font-family: 'Montserrat', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: #e8c878;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .tweak-label {
    font-size: 10px;
    color: #e8c87899;
    font-weight: 500;
    letter-spacing: 0.05em;
    margin-bottom: 7px;
    display: block;
  }
  .tweak-options { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .tweak-opt {
    padding: 8px 12px;
    border-radius: 7px;
    border: 1px solid #e8c87830;
    background: transparent;
    color: #e8c87880;
    font-family: 'Montserrat', sans-serif;
    font-size: 10px;
    font-weight: 500;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s;
  }
  .tweak-opt:hover { border-color: #e8c87860; color: #e8c878bb; }
  .tweak-opt.sel { background: #e8c87815; border-color: #e8c87870; color: #e8c878; }
  .tweak-sep { height: 1px; background: #e8c87820; margin: 10px 0; }
  .autoplay-row {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 10px; color: #e8c87899; font-weight: 500; letter-spacing: 0.05em;
  }
  .toggle-btn {
    width: 34px; height: 18px;
    border-radius: 9px;
    background: #e8c87820;
    border: 1px solid #e8c87840;
    cursor: pointer;
    position: relative;
    transition: background 0.2s;
  }
  .toggle-btn.on { background: #e8c87850; }
  .toggle-knob {
    position: absolute;
    top: 2px; left: 2px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: #e8c87870;
    transition: transform 0.2s, background 0.2s;
  }
  .toggle-btn.on .toggle-knob { transform: translateX(16px); background: #e8c878; }
</style>
</head>

<script type="text/babel">

const { useState, useEffect, useRef, useCallback } = React;

// ── Brand palette
const NAVY = '#12192e';
const GOLD = '#e8c878';
const GOLD_DIM = '#e8c87840';
const GOLD_LITE = '#f5e19e';

// ── Variation themes
const THEMES = {
  nocturno: {
    name: 'Nocturno',
    sub: 'Oscuro & estelar',
    bg: (idx) => [
    'radial-gradient(ellipse at 50% 0%, #1e2d4e 0%, #12192e 70%)',
    'linear-gradient(160deg, #12192e 0%, #0d1525 100%)',
    'radial-gradient(ellipse at 30% 70%, #1a2a40 0%, #0d1422 100%)',
    'linear-gradient(180deg, #0d1422 0%, #12192e 100%)',
    'radial-gradient(ellipse at 70% 30%, #1a2a3e 0%, #0a1020 100%)',

    '#080808'][
    idx % 6],
    cardBg: '#1a1a1a',
    cardBorder: '#e8c87825'
  }
};

// ── Slide content
const SLIDES = [
{
  id: 'bienvenida',
  type: 'hero'
},
{
  id: 'propuesta',
  type: 'features'
},
{
  id: 'proceso1',
  type: 'steps-a'
},
{
  id: 'proceso2',
  type: 'steps-b'
},
{
  id: 'cta1',
  type: 'cta'
},
{
  id: 'contacto',
  type: 'contact'
}];


// ── Decorative stars
function StarsLayer() {
  const stars = useRef([]);
  if (!stars.current.length) {
    for (let i = 0; i < 60; i++) {
      stars.current.push({
        x: Math.random() * 100,
        y: Math.random() * 100,
        s: Math.random() * 1.8 + 0.4,
        d: 2 + Math.random() * 4,
        delay: Math.random() * 4,
        minOp: 0.05 + Math.random() * 0.1,
        maxOp: 0.3 + Math.random() * 0.5
      });
    }
  }
  return (
    <>
      {stars.current.map((s, i) =>
      <div key={i} className="star" style={{
        left: s.x + '%', top: s.y + '%',
        width: s.s + 'px', height: s.s + 'px',
        '--d': s.d + 's', '--delay': s.delay + 's',
        '--min-op': s.minOp, '--max-op': s.maxOp
      }} />
      )}
    </>);

}

// ── Slide components

  return (

        fontWeight: 300
      }}>
        {lang === 'es' ? 'En la intimidad de tu hogar' : 'In the intimacy of your home'}
      </p>
    </div>);

}

      }}>

      </p>
      <div className="gold-line anim-1" />

      </h2>
      {steps.map(([num, title, sub], i) =>
      <div key={i} className={`anim-${i + 3}`} style={{
        display: 'flex', alignItems: 'flex-start', gap: 16,
        padding: '16px 18px', borderRadius: 12, marginBottom: 12,

            <div style={{ fontFamily: "'Montserrat', sans-serif", fontSize: 10, color: '#e8c87870', marginTop: 4, fontWeight: 300, letterSpacing: '0.06em' }}>{sub}</div>

      <p className="anim-5" style={{
        fontFamily: "'Montserrat', sans-serif", fontSize: 9,
        color: '#e8c87850', letterSpacing: '0.15em',
        textTransform: 'uppercase', marginTop: 10
      }}>
        {lang === 'es' ? '2 de 2' : '2 of 2'}
      </p>
    </div>);

}

      <div className="deco-ring" style={{ width: 240, height: 240, top: '50%', left: '50%', transform: 'translate(-50%,-50%)', position: 'absolute', animationDelay: '1.5s', opacity: 0.2 }} />

// ── Main app
function App() {
  const [curSlide, setCurSlide] = useState(() => {
    try {return parseInt(localStorage.getItem('cc-slide') || '0');} catch {return 0;}
  });
  const [prevSlide, setPrevSlide] = useState(null);
  const [animState, setAnimState] = useState('idle'); // idle | transitioning
  const [lang, setLang] = useState('es');
  const [themeKey, setThemeKey] = useState('nocturno');
  const [autoplay, setAutoplay] = useState(false);
  const [tweaksOpen, setTweaksOpen] = useState(false);
  const timerRef = useRef(null);

  const theme = THEMES[themeKey];
  const N = SLIDES.length;

  // Persist slide
  useEffect(() => {
    try {localStorage.setItem('cc-slide', curSlide);} catch {}
  }, [curSlide]);

  // Autoplay
  useEffect(() => {
    if (autoplay) {
      timerRef.current = setInterval(() => goTo((c) => (c + 1) % N), 5000);
    }
    return () => clearInterval(timerRef.current);
  }, [autoplay, N]);

  const goTo = useCallback((target) => {
    const next = typeof target === 'function' ? target(curSlide) : target;
    if (next === curSlide || animState === 'transitioning') return;
    setAnimState('transitioning');
    setPrevSlide(curSlide);
    setCurSlide(next);
    setTimeout(() => {setPrevSlide(null);setAnimState('idle');}, 700);
  }, [curSlide, animState]);

  const prev = () => goTo((curSlide - 1 + N) % N);
  const next = () => goTo((curSlide + 1) % N);

  // Tweaks protocol
  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const renderSlide = (idx) => {
    const props = { lang, theme };
    const t = SLIDES[idx].type;
    if (t === 'hero') return <SlideHero {...props} />;
    if (t === 'features') return <SlideFeatures {...props} />;
    if (t === 'steps-a') return <SlideStepsA {...props} />;
    if (t === 'steps-b') return <SlideStepsB {...props} />;
    if (t === 'cta') return <SlideCTA {...props} />;
    if (t === 'contact') return <SlideContact {...props} />;
  };

  return (
    <>
      {/* Phone */}
      <div className="phone-shell">
        {/* Progress bar */}
        <div className="progress-bar" style={{ width: `${(curSlide + 1) / N * 100}%` }} />

        <div className="slide-viewport" style={{ background: theme.bg(curSlide) }}>
          {/* Stars */}
          <div style={{ position: 'absolute', inset: 0, pointerEvents: 'none', overflow: 'hidden' }}>
            <StarsLayer />
          </div>

          {/* Lang toggle */}
          <div className="lang-toggle">
            {['es', 'en'].map((l) =>
            <button key={l} className={`lang-btn ${lang === l ? 'active' : ''}`}
            onClick={() => setLang(l)}>{l.toUpperCase()}</button>
            )}
          </div>

          {/* Exiting slide */}
          {prevSlide !== null &&
          <div className="slide exiting" style={{ background: theme.bg(prevSlide) }}>
              {renderSlide(prevSlide)}
            </div>
          }

          {/* Entering slide */}
          <div className="slide entering" key={`${curSlide}-${themeKey}-${lang}`}>
            {renderSlide(curSlide)}
          </div>

          {/* Arrows */}
          <button className="nav-arrow prev" onClick={prev}>‹</button>
          <button className="nav-arrow next" onClick={next}>›</button>

          {/* Dots */}
          <div className="nav-row">
            {SLIDES.map((_, i) =>
            <button key={i} className={`nav-dot ${i === curSlide ? 'active' : ''}`}
            onClick={() => goTo(i)} />
            )}
          </div>
        </div>
      </div>

      {/* Slide counter outside */}
      <div style={{
        position: 'fixed', bottom: 28, left: '50%', transform: 'translateX(-50%)',
        fontFamily: "'Montserrat', sans-serif", fontSize: 10,
        color: '#e8c87850', letterSpacing: '0.15em',
        zIndex: 5
      }}>
        {curSlide + 1} / {N}
      </div>

      {/* Tweaks panel */}
      <div className={`tweaks-panel ${tweaksOpen ? 'open' : ''}`}>
        <div className="tweaks-title">Tweaks</div>

        <span className="tweak-label">Estilo visual</span>
        <div className="tweak-options">
          {Object.entries(THEMES).map(([k, t]) =>
          <button key={k} className={`tweak-opt ${themeKey === k ? 'sel' : ''}`}
          onClick={() => setThemeKey(k)}>
              <strong>{t.name}</strong> — {t.sub}
            </button>
          )}
        </div>

        <div className="tweak-sep" />

        <span className="tweak-label">Idioma</span>
        <div className="tweak-options" style={{ flexDirection: 'row' }}>
          {['es', 'en'].map((l) =>
          <button key={l} className={`tweak-opt ${lang === l ? 'sel' : ''}`}
          style={{ flex: 1, textAlign: 'center' }}
          onClick={() => setLang(l)}>{l === 'es' ? '🇦🇷 ES' : '🇺🇸 EN'}</button>
          )}
        </div>

        <div className="tweak-sep" />

        <div className="autoplay-row">
          <span>Autoplay (5s)</span>
          <button className={`toggle-btn ${autoplay ? 'on' : ''}`} onClick={() => setAutoplay((a) => !a)}>
            <div className="toggle-knob" />
          </button>
        </div>
      </div>
    </>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<div id="root"></div>
</body>
</html>
