<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Celestia Management · Acceso</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--terra:#B08A30;--terra-d:#8A6A20;--terra-l:rgba(201,168,76,.13);--terra-b:rgba(201,168,76,.28);--ink:#0F1B28;--muted:#6B6560;--muted-l:#9C9490;--sand:#FAF6EF;--white:#fff}
body{font-family:'DM Sans',sans-serif;background:var(--ink);color:var(--sand);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background-image:radial-gradient(ellipse 60% 50% at 80% 10%,rgba(201,168,76,.08) 0%,transparent 60%),radial-gradient(ellipse 40% 40% at 10% 85%,rgba(201,168,76,.05) 0%,transparent 55%)}
.card{width:100%;max-width:420px}
.logo{display:flex;align-items:center;gap:8px;margin-bottom:36px}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--terra)}
.logo-text{font-family:'DM Serif Display',serif;font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted-l)}
h1{font-family:'DM Serif Display',serif;font-size:30px;font-weight:900;color:var(--white);line-height:1.1;margin-bottom:6px}
h1 em{font-style:italic;color:var(--terra)}
.subtitle{font-size:13px;color:var(--muted-l);margin-bottom:36px;line-height:1.6}
.field{margin-bottom:16px}
label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-l);margin-bottom:6px;font-weight:500}
input{width:100%;padding:13px 16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:var(--sand);font-family:'DM Sans',sans-serif;font-size:15px;outline:none;transition:border-color .2s}
input:focus{border-color:var(--terra-b);background:rgba(255,255,255,.07)}
input::placeholder{color:var(--muted)}
.btn{width:100%;padding:15px;background:var(--terra);color:var(--white);border:none;border-radius:10px;font-family:'DM Serif Display',serif;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px;transition:background .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--terra-d)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none}
.btn.loading .spinner{display:block}
.btn.loading .btn-text{display:none}
.error{background:rgba(180,50,50,.12);border:1px solid rgba(220,80,80,.25);border-radius:8px;padding:12px 14px;font-size:13px;color:#f0a0a0;margin-top:12px;display:none}
.error.show{display:block}
.foot{margin-top:28px;font-size:11px;color:var(--muted);text-align:center;line-height:1.7}
.foot a{color:var(--terra);text-decoration:none}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<link rel="icon" href="/img/management/favicon.png">
<style id="celestia-tema">
/* Celestia Management: tipografías y detalles de marca */
h1,h2,h3,h4,.serif{font-family:'DM Serif Display',Georgia,serif!important;font-weight:400!important;letter-spacing:0!important}
.cm-barra{position:sticky;top:0;z-index:9999;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#0D1B2A;padding:8px 22px;border-bottom:1px solid rgba(201,168,76,.18);font-family:'DM Sans',sans-serif}
.cm-barra img{height:40px;width:auto;display:block}
.cm-barra nav{display:flex;gap:18px;align-items:center}
.cm-barra nav a{color:rgba(250,246,239,.82);text-decoration:none;font-size:13.5px;font-weight:500}
.cm-barra nav a:hover{color:#E8C96A}
.cm-barra nav a.cta{background:linear-gradient(135deg,#E8C96A,#C9A84C);color:#0D1B2A;font-weight:700;padding:8px 16px;border-radius:999px}
@media(max-width:700px){.cm-barra nav a:not(.cta){display:none}.cm-barra{padding:8px 14px}.cm-barra img{height:34px}}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><div class="logo-dot"></div><div class="logo-text">Celestia Management</div></div>
  <h1>Acceso a la<br><em>plataforma educativa.</em></h1>
  <p class="subtitle">Ingresá con tu email y contraseña para acceder a tus cursos.</p>
  <div class="field">
    <label>Email</label>
    <input type="email" id="email" placeholder="tu@email.com" autocomplete="email">
  </div>
  <div class="field">
    <label>Contraseña</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
  </div>
  <button class="btn" id="btnLogin" onclick="doLogin()">
    <div class="spinner"></div>
    <span class="btn-text">Ingresar →</span>
  </button>
  <div class="error" id="errorMsg"></div>
  <div class="foot">
    <a href="#" id="lnkReset" style="color:var(--terra)">¿Olvidaste tu contraseña?</a><br>
    <div id="resetBox" style="display:none;margin:12px 0;padding:14px;border:1px solid var(--terra-b);border-radius:10px;text-align:left;font-size:13px;line-height:1.6">
      Escribí tu email arriba y tocá el botón: te mandamos una contraseña nueva.
      <button type="button" class="btn" id="btnReset" style="margin-top:10px"><span class="btn-text">Enviarme una contraseña nueva</span></button>
      <div id="resetMsg" style="margin-top:8px"></div>
    </div>
    ¿No tenés acceso? <a href="https://wa.me/5491160410607?text=Hola%20Daro!%20Necesito%20ayuda%20con%20mi%20acceso%20a%20los%20cursos%20de%20Celestia%20Management" target="_blank" rel="noopener">Escribinos por WhatsApp</a> · <a href="/management#cursos">Ver cursos</a><br>
    <a href="/management" style="color:var(--muted-l)">← Volver al sitio</a>
  </div>
</div>
<script>
// If already logged in, redirect
const stored = localStorage.getItem('mf_token');
if (stored) {
  fetch('/api/mf/auth?action=verify', { headers: { 'Authorization': 'Bearer ' + stored } })
    .then(r => r.json())
    .then(d => { if (d.user) window.location.href = '/management/cursos'; })
    .catch(() => {});
}

document.getElementById('email').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('password').focus(); });
document.getElementById('password').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

document.getElementById('lnkReset').addEventListener('click', e => { e.preventDefault(); const b = document.getElementById('resetBox'); b.style.display = b.style.display === 'none' ? 'block' : 'none'; document.getElementById('email').focus(); });
document.getElementById('btnReset').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim(), m = document.getElementById('resetMsg'), b = document.getElementById('btnReset');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { m.textContent = 'Escribí arriba el email con el que compraste.'; return; }
  b.disabled = true; m.textContent = 'Enviando…';
  try {
    const r = await fetch('/api/mf/auth?action=reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) });
    m.innerHTML = r.ok ? '✓ Si ese email tiene una cuenta, en unos minutos te llega la contraseña nueva. Revisá también spam.' : 'No se pudo enviar. Escribinos por <a href="https://wa.me/5491160410607" target="_blank" rel="noopener">WhatsApp</a>.';
  } catch (e) { m.innerHTML = 'No se pudo enviar. Escribinos por <a href="https://wa.me/5491160410607" target="_blank" rel="noopener">WhatsApp</a>.'; }
  b.disabled = false;
});

async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('btnLogin');
  const err = document.getElementById('errorMsg');

  if (!email || !password) { showError('Completá email y contraseña.'); return; }

  btn.classList.add('loading');
  btn.disabled = true;
  err.classList.remove('show');

  try {
    const res = await fetch('/api/mf/auth?action=login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();

    if (!res.ok) { showError(data.error || 'Error al ingresar.'); return; }

    localStorage.setItem('mf_token', data.token);
    localStorage.setItem('mf_user', JSON.stringify(data.user));

    // Redirect to cursos or the page they were trying to access
    const next = new URLSearchParams(location.search).get('next') || '/management/cursos';
    window.location.href = next;

  } catch(e) {
    showError('Error de conexión. Intentá de nuevo.');
  } finally {
    btn.classList.remove('loading');
    btn.disabled = false;
  }
}

function showError(msg) {
  const err = document.getElementById('errorMsg');
  err.textContent = msg;
  err.classList.add('show');
}
</script>
</body>
</html>
