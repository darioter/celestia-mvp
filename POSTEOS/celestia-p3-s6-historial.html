<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1920px;overflow:hidden;}
.slide{width:1080px;height:1920px;background:#1A1A2E;display:flex;align-items:center;justify-content:center;padding:110px 90px;position:relative;overflow:hidden;}
</style></head>
<body><div class="slide">
    <div style="position:absolute;inset:0;background:radial-gradient(ellipse 70% 50% at 20% 40%,rgba(201,168,76,0.07),transparent 60%);"></div>
    <div style="position:absolute;top:72px;right:88px;font-family:'DM Sans',sans-serif;font-size:14px;letter-spacing:3px;color:rgba(255,255,255,0.25);text-transform:uppercase;">Paso 6 de 6</div>
    <div style="position:relative;z-index:1;width:100%;">

      <!-- Número grande decorativo -->
      <div style="font-family:'DM Serif Display',serif;font-style:italic;font-size:180px;line-height:1;color:rgba(201,168,76,0.08);position:absolute;top:-60px;right:-20px;pointer-events:none;">6</div>

      <!-- Ícono + paso -->
      <div style="display:flex;align-items:center;gap:20px;margin-bottom:40px;">
        <div style="width:64px;height:64px;border-radius:50%;background:#C9A84C;display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0;">⭐</div>
        <span style="font-family:'DM Sans',sans-serif;font-size:16px;letter-spacing:5px;text-transform:uppercase;color:#C9A84C;">Paso 6</span>
      </div>

      <!-- Título -->
      <h2 style="font-family:'DM Serif Display',serif;font-size:80px;color:#fff;line-height:1.1;margin-bottom:36px;">Historial, valoración y próxima reserva</h2>

      <!-- Bajada -->
      <p style="font-family:'DM Sans',sans-serif;font-size:30px;font-weight:300;color:rgba(255,255,255,0.58);line-height:1.6;margin-bottom:48px;">El servicio termina — el sistema sigue trabajando.</p>

      <!-- Detalle -->
      <div style="background:rgba(255,255,255,0.06);border-radius:16px;padding:36px 40px;border-left:3px solid #C9A84C;">
        <p style="font-family:'DM Sans',sans-serif;font-size:24px;color:rgba(255,255,255,0.58);line-height:1.65;">El menú, las fotos, la valoración del chef quedan guardados en tu perfil. La próxima reserva tarda dos minutos. Celestia crece con cada cena.</p>
      </div>

      
      <!-- Badge plataforma -->
      <div style="display:inline-flex;align-items:center;gap:12px;margin-top:36px;padding:14px 28px;background:rgba(201,168,76,0.12);border-radius:40px;border:1px solid rgba(201,168,76,0.2);">
        <span style="font-size:18px;">🔒</span>
        <span style="font-family:'DM Sans',sans-serif;font-size:17px;color:#E2C06A;font-weight:500;">Historial completo · chefprivado.ar</span>
      </div>
    </div>
  </div></body></html>
