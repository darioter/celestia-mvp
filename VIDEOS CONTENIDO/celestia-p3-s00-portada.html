<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1920px;overflow:hidden;}
.slide{
  width:1080px;height:1920px;
  background:#1A1A2E;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}

/* Gradientes atmosféricos */
.slide::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 90% 60% at 50% 30%, rgba(201,168,76,0.1) 0%, transparent 55%),
    radial-gradient(ellipse 60% 40% at 80% 80%, rgba(201,168,76,0.05) 0%, transparent 50%),
    radial-gradient(ellipse 50% 30% at 10% 70%, rgba(201,168,76,0.04) 0%, transparent 50%);
}

/* Líneas decorativas diagonales de fondo */
.bg-lines{
  position:absolute;inset:0;
  background-image:
    repeating-linear-gradient(
      -45deg,
      transparent,
      transparent 120px,
      rgba(201,168,76,0.015) 120px,
      rgba(201,168,76,0.015) 121px
    );
}

/* Marco elegante */
.frame{
  position:absolute;
  top:60px;left:60px;right:60px;bottom:60px;
  border:1px solid rgba(201,168,76,0.12);
  border-radius:4px;
}
.frame::before{
  content:'';position:absolute;
  top:12px;left:12px;right:12px;bottom:12px;
  border:1px solid rgba(201,168,76,0.06);
  border-radius:2px;
}

/* Esquinas decorativas */
.corner{position:absolute;width:28px;height:28px;}
.corner::before,.corner::after{content:'';position:absolute;background:#C9A84C;}
.corner::before{width:100%;height:1px;top:0;left:0;}
.corner::after{width:1px;height:100%;top:0;left:0;}
.tl{top:72px;left:72px;}
.tr{top:72px;right:72px;transform:scaleX(-1);}
.bl{bottom:72px;left:72px;transform:scaleY(-1);}
.br{bottom:72px;right:72px;transform:scale(-1);}

/* Contenido central */
.content{
  position:relative;z-index:1;
  display:flex;flex-direction:column;
  align-items:center;text-align:center;
  padding:0 120px;
}

/* Línea superior */
.top-rule{
  display:flex;align-items:center;gap:16px;
  margin-bottom:60px;
}
.rule-line{width:80px;height:1px;background:linear-gradient(to right,transparent,#C9A84C);}
.rule-line.r{background:linear-gradient(to left,transparent,#C9A84C);}
.rule-dot{width:5px;height:5px;border-radius:50%;background:#C9A84C;}

.pretitle{
  font-family:'DM Sans',sans-serif;
  font-size:16px;letter-spacing:7px;
  text-transform:uppercase;color:#C9A84C;
  margin-bottom:44px;opacity:0.8;
}

/* Logo principal */
.logo-wrap{margin-bottom:16px;}
.logo-celestia{
  font-family:'DM Serif Display',serif;
  font-size:130px;color:#fff;
  letter-spacing:-2px;line-height:1;
  display:block;
}
.logo-chefs{
  font-family:'DM Serif Display',serif;
  font-style:italic;
  font-size:80px;color:#C9A84C;
  letter-spacing:2px;line-height:1;
  display:block;
  margin-top:-8px;
}

/* Ornamento central */
.orn{
  display:flex;align-items:center;gap:20px;
  margin:52px 0;
}
.orn-line{width:100px;height:1px;background:linear-gradient(to right,transparent,rgba(201,168,76,0.5));}
.orn-line.r{background:linear-gradient(to left,transparent,rgba(201,168,76,0.5));}
.orn-center{
  display:flex;align-items:center;gap:8px;
}
.orn-diamond{
  width:6px;height:6px;
  background:#C9A84C;
  transform:rotate(45deg);
}
.orn-diamond.sm{width:4px;height:4px;opacity:0.5;}

.tagline{
  font-family:'DM Serif Display',serif;
  font-style:italic;
  font-size:34px;color:rgba(255,255,255,0.35);
  line-height:1.5;letter-spacing:0.5px;
  margin-bottom:64px;
}

/* Sistema badge */
.sistema-badge{
  display:flex;flex-direction:column;align-items:center;gap:14px;
}
.badge-items{
  display:flex;gap:12px;flex-wrap:wrap;justify-content:center;
}
.badge-item{
  font-family:'DM Sans',sans-serif;
  font-size:15px;font-weight:400;
  padding:8px 20px;
  border:1px solid rgba(201,168,76,0.22);
  border-radius:30px;
  color:rgba(201,168,76,0.7);
  letter-spacing:0.5px;
}
.badge-url{
  font-family:'DM Sans',sans-serif;
  font-size:18px;font-weight:500;
  color:rgba(255,255,255,0.2);
  letter-spacing:3px;
  margin-top:8px;
}

/* Bottom strip */
.bottom-strip{
  position:absolute;
  bottom:100px;
  display:flex;align-items:center;gap:0;
}
.strip-seg{
  height:1px;
  background:rgba(201,168,76,0.2);
}
.strip-num{
  font-family:'DM Serif Display',serif;
  font-style:italic;
  font-size:13px;
  color:rgba(201,168,76,0.3);
  padding:0 16px;
  letter-spacing:2px;
}
</style>
</head>
<body>
<div class="slide">
  <div class="bg-lines"></div>
  <div class="frame"></div>

  <!-- Esquinas decorativas -->
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="content">
    <div class="top-rule">
      <div class="rule-line"></div>
      <div class="rule-dot"></div>
      <div class="rule-line r"></div>
    </div>

    <p class="pretitle">Bienvenido a</p>

    <div class="logo-wrap">
      <span class="logo-celestia">Celestia</span>
      <span class="logo-chefs">Chefs Privados</span>
    </div>

    <div class="orn">
      <div class="orn-line"></div>
      <div class="orn-center">
        <div class="orn-diamond sm"></div>
        <div class="orn-diamond"></div>
        <div class="orn-diamond sm"></div>
      </div>
      <div class="orn-line r"></div>
    </div>

    <p class="tagline">
      "Tu cocina, el escenario.<br>Un chef, la experiencia."
    </p>

    <div class="sistema-badge">
      <div class="badge-items">
        <span class="badge-item">🔒 Chef verificado</span>
        <span class="badge-item">📍 Trazabilidad real</span>
        <span class="badge-item">📋 Todo registrado</span>
      </div>
      <p class="badge-url">chefprivado.ar</p>
    </div>
  </div>

  <div class="bottom-strip">
    <div class="strip-seg" style="width:120px;"></div>
    <span class="strip-num">Buenos Aires · 2026</span>
    <div class="strip-seg" style="width:120px;"></div>
  </div>
</div>
</body>
</html>
